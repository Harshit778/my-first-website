<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #444;
            font-size: 18px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Website!</h1>

        <p>
            Hello! I am learning how to host a
            static website using GitHub Pages.
        </p>

        <button onclick="alert('Thanks for visiting!')">
            Click Me
        </button>
    </div>
</body>
</html>
